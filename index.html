<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My GitHub Site</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      color: #333;
      text-align: center;
    }
    header {
      background: #24292e;
      color: white;
      padding: 40px 20px;
    }
    main {
      padding: 40px 20px;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #0366d6;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
    .btn:hover {
      background: #024ea2;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Website</h1>
    <p>Hosted for free on GitHub Pages</p>
  </header>
  <main>
    <h2>Hello!</h2>
    <p>This is my first website using GitHub.io.</p>
    <a class="btn" href="https://github.com/">Visit GitHub</a>
  </main>
</body>
</html>
